<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Kalkulator Breeding & Mutasi Finch</title>
<meta name="description" content="Hitung kemungkinan warna anakan finch: Gould, Zebra, Emprit Jepang, Gelatik Jawa, Madrim, Shaft Tail, Star, Strawberry, Cut-throat dan Owl Finch.">

<meta property="og:description" content="Atur mutasi dan split indukan, lihat persentase warna anakan, kelangkaan, dan suara khas tiap jenis.">

<meta property="og:image" content="https://USERNAME.github.io/REPO/preview.png"> -->
<meta name="theme-color" content="#12261f">
<script>
  // Tempel link Web App Google Apps Script Anda (berakhiran /exec)
  const APP_URL = 'https://script.google.com/macros/s/GANTI_DENGAN_ID_DEPLOYMENT/exec';
</script>
<!-- =================================================== -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312261f'/%3E%3Cellipse cx='36' cy='38' rx='18' ry='12' fill='%233f9b2f'/%3E%3Ccircle cx='22' cy='28' r='10' fill='%23151515'/%3E%3Cpath d='M13 26 L4 30 L13 33Z' fill='%23efe4c7'/%3E%3Cellipse cx='30' cy='40' rx='8' ry='6' fill='%237b3fb2'/%3E%3Cellipse cx='38' cy='46' rx='10' ry='5' fill='%23f4c51f'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#12261f;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:#fff;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  #muat{position:fixed;inset:0;display:grid;place-items:center;background:#12261f;color:#eef5ef;
        font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;transition:opacity .4s;z-index:2}
  #muat.hilang{opacity:0;pointer-events:none}
  .kotak{display:grid;gap:14px;justify-items:center;padding:24px}
  .burung{width:110px;height:auto;animation:lompat 1s ease-in-out infinite alternate}
  @keyframes lompat{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
  .garis{width:160px;height:4px;border-radius:4px;background:#24402f;overflow:hidden}
  .garis i{display:block;width:40%;height:100%;background:#f2c230;animation:jalan 1.2s ease-in-out infinite}
  @keyframes jalan{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
  #lambat{display:none;font-size:14px;color:#b9cbbf;max-width:300px}
  #lambat a{color:#f2c230;font-weight:600}
  @media(prefers-reduced-motion:reduce){.burung,.garis i{animation:none}}
</style>
</head>
<body>
<div id="muat" role="status" aria-live="polite">
  <div class="kotak">
    <svg class="burung" viewBox="0 0 120 90" aria-hidden="true">
      <path d="M86 52 L116 66 L113 74 L82 62Z" fill="#161616"/>
      <ellipse cx="66" cy="54" rx="34" ry="22" transform="rotate(18 66 54)" fill="#3f9b2f"/>
      <ellipse cx="56" cy="64" rx="22" ry="11" fill="#f4c51f"/>
      <ellipse cx="46" cy="54" rx="14" ry="13" fill="#7b3fb2"/>
      <path d="M50 44 C64 36 88 46 100 64 C86 66 66 64 54 58Z" fill="#3c8f2b"/>
      <circle cx="38" cy="34" r="16" fill="#3fc4d4"/><circle cx="38" cy="34" r="14" fill="#151515"/>
      <circle cx="33" cy="31" r="2.6" fill="#fff"/>
      <path d="M24 30 L12 36 L24 41Z" fill="#efe4c7"/>
      <rect x="30" y="80" width="70" height="5" rx="2.5" fill="#8a6a4a"/>
    </svg>
    <b>Memuat Kalkulator Breeding Finch…</b>
    <div class="garis"><i></i></div>
    <p id="lambat">Pemuatan agak lama. Jika tidak muncul, <a id="langsung" href="#" target="_blank" rel="noopener">buka aplikasi langsung</a>.</p>
  </div>
</div>

<iframe id="app" title="Kalkulator Breeding & Mutasi Finch"
  allow="autoplay; clipboard-write; fullscreen"
  referrerpolicy="no-referrer-when-downgrade"></iframe>

<noscript><p style="color:#fff;padding:20px">Aktifkan JavaScript, atau buka aplikasinya langsung dari link Google Apps Script.</p></noscript>

<script>
  const app = document.getElementById('app'), muat = document.getElementById('muat');
  document.getElementById('langsung').href = APP_URL;
  app.addEventListener('load', () => { muat.classList.add('hilang'); setTimeout(() => muat.remove(), 500); });
  setTimeout(() => { const l = document.getElementById('lambat'); if (l) l.style.display = 'block'; }, 10000);
  app.src = APP_URL;
</script>
</body>
</html>
